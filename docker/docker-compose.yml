# Codebase Intelligence Assistant - local run
# Set OPENAI_API_KEY in .env or pass in run
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../indexes:/app/indexes
      - ../logs:/app/logs
      - ../traces:/app/traces
    environment:
      - CHROMA_PERSIST_DIR=/app/indexes
      - LOG_LEVEL=INFO
