[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-intel-assistant"
version = "0.1.0"
description = "Codebase Intelligence Assistant with RAG and LangChain"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Codebase Intelligence Team" }]
dependencies = [
    "langchain-core>=0.1.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "openai>=1.12.0,<2.0",
    "chromadb>=0.4.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=7.4.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "ingest", "rag", "agent", "analysis", "eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "integration: marks tests that need real API keys (deselect with '-m \"not integration\"')",
]
